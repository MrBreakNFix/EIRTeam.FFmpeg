name: 'Android Build'

on:
  workflow_call:
    inputs:
      target:
        description: 'Build target'
        required: true
        type: string
      artifact-name:
        description: 'Artifact name'
        required: false
        type: string
        default: 'android-build'

jobs:
  build:
    name: 'Build for Android'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Remove pre-installed NDK
        run: sudo rm -rf /usr/local/lib/android/sdk/ndk

      - name: Set up Android NDK r25c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make autoconf automake libtool pkg-config ninja-build

      - name: Fix Makefile for CI
        run: sed -i 's/ ninja / ninja-build /g' Makefile

      - name: Bootstrap FFmpeg-kit
        run: make bootstrap

      - name: Build for Android arm64-v8a
        run: make gdextension PLATFORM=android TARGET_ARCH=arm64-v8a
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build for Android armeabi-v7a
        run: make gdextension PLATFORM=android TARGET_ARCH=armeabi-v7a
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            ./addons/eirteam_ffmpeg/bin/android*
