name: 🤖 Android Builds
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

# Global Settings
env:
  GODOT_BASE_BRANCH: master
  SCONS_CACHE_MSVC_CONFIG: true

concurrency:
  cancel-in-progress: true
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-android-${{ inputs.target }}

jobs:
  build-android:
    runs-on: "ubuntu-22.04"
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android build - ${{ inputs.target }}
            cache-name: Android
            target: ${{ inputs.target }}
            artifact-name: ${{ inputs.artifact-name }}
            sconsflags: debug_symbols=no
            arch: arm64
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Download FFmpeg for Android
        run: |
          set -e
          
          # Create directory structure
          mkdir -p ffmpeg-android/lib
          mkdir -p ffmpeg-android/include
          
          echo "Downloading pre-built FFmpeg for Android..."
          
          # Try multiple sources in order
          SUCCESS=0
          
          # Source 1: Try BtbN/FFmpeg-Builds (known to have Android builds)
          echo "Trying BtbN/FFmpeg-Builds..."
          if wget --spider -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-android24-lgpl-arm64.tar.xz" 2>/dev/null; then
            if wget -q "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-android24-lgpl-arm64.tar.xz" -O ffmpeg.tar.xz; then
              echo "Downloaded from BtbN/FFmpeg-Builds"
              tar xf ffmpeg.tar.xz
              # Find the extracted directory
              EXTRACTED_DIR=$(tar -tf ffmpeg.tar.xz | head -1 | cut -f1 -d"/")
              if [ -d "$EXTRACTED_DIR" ]; then
                cp -r "$EXTRACTED_DIR"/* ffmpeg-android/
                SUCCESS=1
              fi
            fi
          fi
          
          # Source 2: Try arthenica/ffmpeg-kit AAR
          if [ $SUCCESS -eq 0 ]; then
            echo "Trying arthenica/ffmpeg-kit AAR..."
            if wget -q "https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-min-gpl-6.0.aar" -O ffmpeg-kit.aar; then
              echo "Downloaded ffmpeg-kit AAR"
              unzip -q ffmpeg-kit.aar -d ffmpeg-aar
              
              # Copy arm64-v8a libraries
              if [ -d "ffmpeg-aar/jni/arm64-v8a" ]; then
                cp ffmpeg-aar/jni/arm64-v8a/*.so ffmpeg-android/lib/
                
                # Extract includes from prefab modules
                if [ -d "ffmpeg-aar/prefab" ]; then
                  for module_dir in ffmpeg-aar/prefab/modules/*; do
                    if [ -d "$module_dir/include" ]; then
                      cp -r "$module_dir"/include/* ffmpeg-android/include/ 2>/dev/null || true
                    fi
                  done
                fi
                
                # Check if we got libraries
                if ls ffmpeg-android/lib/*.so 1> /dev/null 2>&1; then
                  SUCCESS=1
                fi
              fi
            fi
          fi
          
          # Source 3: Use pre-built from a CDN mirror
          if [ $SUCCESS -eq 0 ]; then
            echo "Trying alternative mirror..."
            if wget -q "https://sourceforge.net/projects/avbuild/files/android/ffmpeg-master-android-clang-arm64.tar.xz/download" -O ffmpeg.tar.xz; then
              echo "Downloaded from SourceForge mirror"
              tar xf ffmpeg.tar.xz -C ffmpeg-android --strip-components=1 2>/dev/null || tar xf ffmpeg.tar.xz
              if [ -d "ffmpeg-android/lib" ] && ls ffmpeg-android/lib/*.so 1> /dev/null 2>&1; then
                SUCCESS=1
              fi
            fi
          fi
          
          if [ $SUCCESS -eq 0 ]; then
            echo "ERROR: Could not download FFmpeg binaries from any source"
            echo "Attempted sources:"
            echo "  1. BtbN/FFmpeg-Builds"
            echo "  2. arthenica/ffmpeg-kit AAR"
            echo "  3. SourceForge mirror"
            exit 1
          fi
          
          echo "FFmpeg setup complete. Libraries:"
          ls -lh ffmpeg-android/lib/ || echo "No lib directory"
          echo "Headers:"
          find ffmpeg-android/include -type f -name "*.h" | head -10 || echo "No headers found"

      - name: Setup python and scons
        uses: ./.github/actions/deps

      - name: Compilation
        uses: ./.github/actions/build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }} arch=${{ matrix.arch }}
          ffmpeg-path: "../ffmpeg-android/"
          platform: android
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact-name }}
          path: ./gdextension_build/build/*
