name: 🤖 Android Builds
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

# Global Settings
env:
  GODOT_BASE_BRANCH: master
  SCONS_CACHE_MSVC_CONFIG: true

concurrency:
  cancel-in-progress: true
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-android-${{ inputs.target }}

jobs:
  build-android:
    runs-on: "ubuntu-22.04"
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android build - ${{ inputs.target }}
            cache-name: Android
            target: ${{ inputs.target }}
            artifact-name: ${{ inputs.artifact-name }}
            sconsflags: debug_symbols=no
            arch: arm64
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Download FFmpeg for Android
        run: |
          set -e
          
          # Create directory structure
          mkdir -p ffmpeg-android/lib
          mkdir -p ffmpeg-android/include
          
          echo "Downloading pre-built FFmpeg for Android..."
          
          # Try to download from EIRTeam FFmpeg-Builds first (matches Linux/Windows pattern)
          if wget -q "https://github.com/EIRTeam/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-android-arm64-lgpl-godot.tar.xz" -O ffmpeg.tar.xz; then
            echo "Downloaded from EIRTeam FFmpeg-Builds"
            tar xf ffmpeg.tar.xz -C ffmpeg-android --strip-components=1
          elif wget -q "https://github.com/arthenica/ffmpeg-kit/releases/download/v6.0/ffmpeg-kit-min-6.0-android.aar" -O ffmpeg-kit.aar; then
            echo "Downloaded ffmpeg-kit AAR"
            # Extract libraries from AAR
            unzip -q ffmpeg-kit.aar -d ffmpeg-aar
            
            # Copy arm64-v8a libraries
            if [ -d "ffmpeg-aar/jni/arm64-v8a" ]; then
              cp ffmpeg-aar/jni/arm64-v8a/*.so ffmpeg-android/lib/
            fi
            
            # Extract includes from prefab
            if [ -d "ffmpeg-aar/prefab" ]; then
              for module in ffmpeg-aar/prefab/modules/*/include; do
                if [ -d "$module" ]; then
                  cp -r "$module"/* ffmpeg-android/include/ 2>/dev/null || true
                fi
              done
            fi
          else
            echo "ERROR: Could not download FFmpeg binaries"
            exit 1
          fi
          
          echo "FFmpeg setup complete. Libraries:"
          ls -lh ffmpeg-android/lib/
          echo "Headers:"
          find ffmpeg-android/include -type f -name "*.h" | head -10 || echo "No headers found"

      - name: Setup python and scons
        uses: ./.github/actions/deps

      - name: Compilation
        uses: ./.github/actions/build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }} arch=${{ matrix.arch }}
          ffmpeg-path: "../ffmpeg-android/"
          platform: android
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact-name }}
          path: ./gdextension_build/build/*
