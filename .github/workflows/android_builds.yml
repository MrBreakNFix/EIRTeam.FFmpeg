name: 🤖 Android Builds
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      artifact-name:
        required: true
        type: string

# Global Settings
env:
  GODOT_BASE_BRANCH: master
  SCONS_CACHE_MSVC_CONFIG: true

concurrency:
  cancel-in-progress: true
  group: ci-${{github.actor}}-${{github.head_ref || github.run_number}}-${{github.ref}}-android-${{ inputs.target }}

jobs:
  build-android:
    runs-on: "ubuntu-22.04"
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android build - ${{ inputs.target }}
            cache-name: Android
            target: ${{ inputs.target }}
            artifact-name: ${{ inputs.artifact-name }}
            sconsflags: debug_symbols=no
            arch: arm64
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            curl cmake gperf groff texinfo yasm nasm \
            bison autogen git wget meson ninja-build \
            rapidjson-dev build-essential

      - name: Build FFmpeg for Android
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          
          echo "Android NDK: $ANDROID_NDK_ROOT"
          echo "Android SDK: $ANDROID_SDK_ROOT"
          
          # Download FFmpeg source
          wget https://ffmpeg.org/releases/ffmpeg-6.0.tar.xz
          tar xf ffmpeg-6.0.tar.xz
          cd ffmpeg-6.0
          
          # Set up Android NDK toolchain
          export NDK=$ANDROID_NDK_ROOT
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export API=24
          export TARGET=aarch64-linux-android
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export AR=$TOOLCHAIN/bin/llvm-ar
          export AS=$CC
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export NM=$TOOLCHAIN/bin/llvm-nm
          
          # Configure FFmpeg for Android arm64
          ./configure \
            --prefix=../ffmpeg-android \
            --enable-cross-compile \
            --target-os=android \
            --arch=arm64 \
            --cpu=armv8-a \
            --cc=$CC \
            --cxx=$CXX \
            --enable-shared \
            --disable-static \
            --disable-doc \
            --disable-programs \
            --disable-symver \
            --disable-debug \
            --enable-gpl \
            --enable-version3 \
            --disable-ffplay \
            --disable-ffprobe \
            --disable-avdevice \
            --disable-vulkan \
            --disable-v4l2-m2m \
            --disable-vaapi \
            --disable-vdpau \
            --extra-cflags="-Os -fPIC" \
            --extra-ldflags="-Wl,-rpath-link=$TOOLCHAIN/sysroot/usr/lib/$TARGET/$API"
          
          # Build and install
          make -j$(nproc)
          # Install without stripping (STRIPPROG="" disables stripping)
          make install STRIPPROG=""
          
          echo "FFmpeg build complete. Checking output:"
          ls -lh ../ffmpeg-android/lib/

      - name: Setup python and scons
        uses: ./.github/actions/deps

      - name: Compilation
        uses: ./.github/actions/build
        with:
          sconsflags: ${{ env.SCONSFLAGS }} ${{ matrix.sconsflags }} arch=${{ matrix.arch }}
          ffmpeg-path: "../ffmpeg-android/"
          platform: android
          target: ${{ matrix.target }}
          tests: ${{ matrix.tests }}

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.artifact-name }}
          path: ./gdextension_build/build/*
